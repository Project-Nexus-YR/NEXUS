name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run tests
        run: pytest -ra
      - name: Coverage
        run: |
          pip install pytest-cov
          pytest --cov=nexus_knowledge --cov=nexus_runtime --cov-report=term-missing --cov-fail-under=80

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and quality tools
        run: pip install -e '.[dev]'
      - name: Format check
        run: python -m ruff format --check src/nexus_runtime
      - name: Lint
        run: python -m ruff check src/nexus_runtime
      - name: Type check
        run: python -m mypy src/nexus_runtime
      - name: Tests
        run: python -m pytest -ra
      - name: Distributed simulation smoke test
        run: python -c "from nexus_runtime.distributed.benchmark import run_benchmark; assert run_benchmark(100, 10)['results']['succeeded'] == 100"
