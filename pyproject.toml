[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus"
dynamic = ["version"]
description = "NEXUS autonomous knowledge-discovery platform: knowledge intelligence engine and fault-tolerant research runtime"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "NEXUS" }]
keywords = ["knowledge-graph", "graphrag", "retrieval", "citations", "evidence", "knowledge-discovery", "ml", "autonomous-agents", "research-runtime"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
citation = ["pypdf>=6.16.2,<7", "defusedxml>=0.7,<1"]
test = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pypdf>=6.16.2,<7",
    "defusedxml>=0.7,<1",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
]
gui = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pypdf>=6.16.2,<7",
    "defusedxml>=0.7,<1",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
]

[project.scripts]
nexus-knowledge = "nexus_knowledge.cli:main"
nexus-runtime = "nexus_runtime.distributed.cli:main"
nexus-runtime-bench = "nexus_runtime.distributed.benchmark:main"
nexus-research = "nexus_runtime.investigation.cli:main"
nexus-investigation-bench = "nexus_runtime.investigation.benchmark:main"
nexus-gui = "nexus_gui.cli:main"
nexus-evidence = "nexus_evidence.cli:main"
nexus-evidence-bench = "nexus_evidence.benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "nexus_knowledge.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.coverage.run]
source = ["nexus_knowledge", "nexus_runtime", "nexus_evidence"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/nexus_runtime", "src/nexus_evidence"]

[[tool.mypy.overrides]]
module = ["nexus_knowledge.*", "numpy.*"]
follow_imports = "skip"
